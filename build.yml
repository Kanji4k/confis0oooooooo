name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1

      - name: Check all project files uploaded
        run: |
          test -f src/main/resources/fabric.mod.json || { echo "MISSING src/main/resources (fabric.mod.json)"; exit 1; }
          test -d intermediary-src/client/confis || { echo "MISSING intermediary-src/client/confis"; exit 1; }
          echo "Java files: $(find intermediary-src -name "*.java" | wc -l) (expect 52)"

      - name: Convert source names (intermediary -> yarn)
        run: python3 tools/yarnify.py

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - name: Show jar contents
        run: unzip -l build/libs/confis0oooooo-client-1.0.0+1.21.11.jar | tail -5

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: confis-mod-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
